<button id="nextButton" onclick="
  if (this.dataset.page === undefined) {
    this.dataset.page = '0';
  }
  if (this.dataset.page === '0') {
    document.getElementById('drinkName').textContent = '馥芮白';
    document.getElementById('milk').textContent = '1️⃣蒸奶：1-2s';
    document.getElementById('coffee').textContent = '2️⃣咖啡：精粹2  3  4';
    document.getElementById('syrup').innerHTML =
      '3️⃣糖浆：原味/0卡：3  4  5<br>风味：3  4  5';
    document.getElementById('finish').innerHTML =
      '4️⃣完成：Hot：杯口下方6mm<br>Ice：上线下方6mm/冰块杯口6mm<br>Ltice：logo6mm/冰块杯口6mm<br>Noice：上线下方6mm/牛奶杯口6mm<br>距杯口3-10cm以一支铅笔粗细缓慢均匀注入发泡牛奶至1/2-2/3，倾斜压低奶缸靠近页面形成白点';
    this.dataset.page = '1';
  } else if (this.dataset.page === '1') {
    document.getElementById('drinkName').textContent = '卡布奇诺';
    document.getElementById('milk').textContent = '1️⃣蒸奶：6-8s';
    document.getElementById('coffee').textContent = '2️⃣咖啡：1  2  2';
    document.getElementById('syrup').innerHTML =
      '3️⃣糖浆：原味/0卡：3  4  5<br>风味：3  4  5';
    document.getElementById('finish').innerHTML =
      '4️⃣完成：杯口6mm<br>干（dry）：多奶泡少牛奶<br>湿（wet）：多牛奶少奶泡';
    this.dataset.page = '2';
  } else if (this.dataset.page === '2') {
    document.getElementById('drinkName').textContent = '摩卡';
    document.getElementById('milk').textContent = '1️⃣蒸奶：退杯X-H';
    document.getElementById('coffee').textContent = '2️⃣咖啡：1  2  2';
    document.getElementById('syrup').textContent =
      '3️⃣摩卡酱15ml：3  4  5';
    document.getElementById('finish').innerHTML =
      '4️⃣完成：<br>摇匀浓缩和摩卡酱<br>Hot：杯口下方6mm<br>Ice：上线/冰块杯口6mm/搅打奶油<br>Ltice：logo/冰块杯口6mm/搅打奶油<br>Noice：上线/牛奶杯口6mm/搅打奶油';
    this.dataset.page = '3';
  } else {
    document.getElementById('drinkName').textContent = '风味拿铁';
    document.getElementById('milk').textContent = '1️⃣蒸奶：3-5s';
    document.getElementById('coffee').textContent = '2️⃣咖啡：1  2  2';
    document.getElementById('syrup').innerHTML =
      '3️⃣糖浆：原味/0卡：3  4  5<br>风味：3  4  5';
    document.getElementById('finish').innerHTML =
      '4️⃣完成：Hot：杯口下方6mm<br>Ice：上线下方6mm/冰块杯口6mm<br>Ltice：logo6mm/冰块杯口6mm<br>Noice：上线下方6mm/牛奶杯口6mm';
    this.dataset.page = '0';
  }
">
  下一杯 →
</button>
